<title>Kristall-Echo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>:root{color-scheme:light;--rock:#ECE8F2;--slab:#fff;--ink:#24213B;--line:#DAD5E8;--am:#6A4BE0;--am-soft:#E3DCFB;--muted:#6E6987;--ok:#178A5E;--bad:#D23C47;
 --pri-bg:#24213B;--pri-fg:#fff;--seg:#DDD7EA;--rowline:#F0EDF6;--nobg:#EFECF6;--grab:#C9C2DC;--sw:#D3CDE3;--nav:rgba(236,232,242,.92);--strong:#24213B;--strong-sub:#CFC8F2;--field:#fff;--shadow:rgba(70,40,170,.55)}
:root[data-theme=dark]{color-scheme:dark;--rock:#100E1F;--slab:#1C1931;--ink:#ECE9FA;--line:#322D4D;--am:#9B85FF;--am-soft:#2F2760;--muted:#A19CBD;--ok:#3CC48D;--bad:#FF6B75;
 --pri-bg:#ECE9FA;--pri-fg:#16132B;--seg:#2A2645;--rowline:#28243F;--nobg:#2A2645;--grab:#4A4468;--sw:#3A3558;--nav:rgba(16,14,31,.88);--strong:#2B2552;--strong-sub:#C3BAF0;--field:#14122A;--shadow:rgba(0,0,0,.7)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--rock);color:var(--ink);font-family:'Bricolage Grotesque',ui-rounded,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.45}
body{padding-bottom:calc(80px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--am);outline-offset:2px}
header{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) max(16px,calc((100% - 488px)/2)) 8px;background:var(--nav);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);margin-bottom:10px}
h1{white-space:nowrap;margin-right:auto!important;font-size:24px;font-weight:800;letter-spacing:-.03em;margin:0;display:flex;align-items:center;gap:8px}
h1 svg{width:26px;height:26px}

#newbtn{white-space:nowrap;border:0;background:var(--pri-bg);color:var(--pri-fg);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
main{max-width:520px;margin:0 auto;padding:0 12px}
h2{font-size:28px;line-height:1.1;letter-spacing:-.03em;margin:8px 0 10px;font-weight:800}
h3{font-size:17px;margin:20px 4px 8px;font-weight:700}
.hint{margin:4px 4px 10px;color:var(--muted);font-size:15px}.hint b{color:var(--ink)}
.small{font-size:14px}
.board{background:var(--slab);border-radius:20px;padding:4px;box-shadow:0 10px 30px -18px var(--shadow)}
.board svg{width:100%;height:auto;display:block;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.grow{flex:1}
.btn{min-height:46px;border-radius:14px;border:1.5px solid var(--ink);background:var(--slab);font-weight:600;padding:0 14px}
.btn.primary{background:var(--pri-bg);color:var(--pri-fg)}
.btn:disabled{opacity:.35;cursor:default}
.tools .btn{flex:1}
.link{border:0;background:none;color:var(--am);font-weight:600;padding:10px 4px;text-decoration:underline;text-underline-offset:3px}
.tray{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
.chip{border:1.5px solid var(--line);background:var(--slab);border-radius:16px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;font-weight:600;font-size:13px;min-height:80px}
.chip .st{font-size:12px;color:var(--muted);font-weight:400}
.chip.on{border-color:var(--am);background:var(--am-soft);box-shadow:inset 0 0 0 1.5px var(--am)}
.seg{display:flex;background:var(--seg);border-radius:14px;padding:3px;margin-top:12px}
.seg button{flex:1;border:0;background:none;border-radius:11px;min-height:40px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--slab);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.log{list-style:none;margin:0;padding:0;background:var(--slab);border-radius:16px;overflow:hidden}
.log li{display:flex;align-items:center;gap:10px;padding:11px 12px;border-top:1px solid var(--rowline);font-size:15px}
.log li:first-child{border-top:0}
.log li.on{background:var(--am-soft)}
.log li[data-act]{cursor:pointer}
.no{width:24px;height:24px;border-radius:50%;background:var(--nobg);font-size:12px;font-weight:700;display:grid;place-items:center;flex:none}
.dots{display:flex;gap:3px}
.ct{color:var(--muted);font-size:13px;margin-right:auto}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink)}
.dot.none{background:repeating-linear-gradient(45deg,#fff 0 2px,#ccc 2px 4px)}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}
.x{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;padding:0 2px 2px;min-width:28px;min-height:28px}
.cap{background:var(--slab);border-radius:14px;padding:10px 12px;margin-top:8px;font-size:14px}
.result{background:var(--strong);color:#fff;border-radius:20px;padding:14px 16px;margin:4px 0 10px}
.rl{font-size:14px;color:var(--strong-sub)}.rbig{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.2;margin:2px 0 8px}
.rdots .dot{width:16px;height:16px;border-color:#fff;margin-right:4px}
.hero{padding:6px 4px}
.hero p{color:var(--muted);margin:0 0 16px}
.mode{display:block;width:100%;text-align:left;border:1.5px solid var(--ink);background:var(--slab);border-radius:18px;padding:14px 16px;margin-bottom:10px}

<body>
<header><h1><svg viewBox="0 0 2 2"><polygon points="1,0 2,1 1,2 0,1" fill="#6A4BE0" stroke="#24213B" stroke-width=".12" stroke-linejoin="round"/><path d="M0,1H2" stroke="#fff" stroke-width=".08" opacity=".7"/></svg>Kristall-Echo</h1><button id="themebtn" data-act="theme" aria-label="Design"></button><button id="newbtn" data-act="newmenu">Neues Spiel</button></header>

<script>
const COLS=10,ROWS=8;
const TRI4=[[1,0,'SE'],[2,0,'SW'],[0,1,'SE'],[1,1,'F'],[2,1,'F'],[3,1,'SW']];
const TRI2=[[0,0,'SW'],[0,1,'F'],[1,1,'SW']];
const TRI1=[[0,0,'SE'],[1,0,'SW']]; // kleines Dreieck, 2 breit, 1 hoch
const RAUTE3=[[0,0,'SE'],[1,0,'F'],[2,0,'NW']];
const BASE={rot:RAUTE3,gelb:TRI2,blau:TRI4,weissR:[[0,0,'SE'],[1,0,'SW'],[0,1,'NE'],[1,1,'NW']],weissT:TRI4,
 trans:TRI1,schwarz:TRI1};
const COLOR={rot:'rot',gelb:'gelb',blau:'blau',weissR:'weiss',weissT:'weiss',trans:'trans',schwarz:'schwarz'};
const DEFAULT_OPTS={color:'orig',mirror:false,scan:false,trans:false,schwarz:false};
let OPTS={...DEFAULT_OPTS},NAMES=[],TINT=[];
function applyOpts(o){OPTS={...DEFAULT_OPTS,...(o||{})};
 NAMES=['rot','gelb','blau','weissR','weissT',...(OPTS.trans?['trans']:[]),...(OPTS.schwarz?['schwarz']:[])];
 TINT=OPTS.color==='orig'?['rot','gelb','blau','weiss']:['rot','gelb','blau']}
applyOpts();
function lab(n){if(n===0)return'–';if(n<=18)return String(n);if(n<=28)return String.fromCharCode(73+(28-n));return String.fromCharCode(65+(36-n))}
function cellName(x,y){return String.fromCharCode(65+y)+(x+1)}
const LABEL_ORDER=[...Array.from({length:18},(_,i)=>i+1),36,35,34,33,32,31,30,29,28,27,26,25,24,23,22,21,20,19];
const ROT={NW:'NE',NE:'SE',SE:'SW',SW:'NW',F:'F'},MIR={NW:'NE',NE:'NW',SW:'SE',SE:'SW',F:'F'};
function norm(c){const mx=Math.min(...c.map(a=>a[0])),my=Math.min(...c.map(a=>a[1]));return c.map(([x,y,k])=>[x-mx,y-my,k])}
function rotCW(c){const h=Math.max(...c.map(a=>a[1]))+1;return norm(c.map(([x,y,k])=>[h-1-y,x,ROT[k]]))}
function mir(c){const w=Math.max(...c.map(a=>a[0]))+1;return norm(c.map(([x,y,k])=>[w-1-x,y,MIR[k]]))}
function shape(n,o){let c=BASE[n].map(a=>a.slice());if(o>=4)c=mir(c);for(let i=0;i<o%4;i++)c=rotCW(c);return c}
function dims(c){return [Math.max(...c.map(a=>a[0]))+1,Math.max(...c.map(a=>a[1]))+1]}
function cellsOf(n,p){return shape(n,p.o).map(([x,y,k])=>[x+p.x,y+p.y,k])}
function boardOf(P){const b={};for(const n of NAMES){const p=P&&P[n];if(!p)continue;for(const [x,y,k] of cellsOf(n,p))b[x+','+y]={n,k}}return b}
const CORN={NW:[0,0],NE:[1,0],SW:[0,1],SE:[1,1]};
function polyOf(k){if(k==='F')return[[0,0],[1,0],[1,1],[0,1]];const a=CORN[k];return[a,[1-a[0],a[1]],[a[0],1-a[1]]]}
// outer edges of a piece as unit segments
function edgesOf(cells){const ed={};for(const [x,y,k] of cells){const p=polyOf(k).map(([a,b])=>[x+a,y+b]);
 p.forEach((q,i)=>{const r=p[(i+1)%p.length];const kk=[q.join(','),r.join(',')].sort().join('|');ed[kk]=(ed[kk]||0)+1})}
 return Object.keys(ed).filter(k=>ed[k]===1)}
// null = ok, otherwise reason
function whyNot(P,n,p){const cells=cellsOf(n,p);
 if(!cells.every(([x,y])=>x>=0&&y>=0&&x<COLS&&y<ROWS))return'out';
 const o={...P};delete o[n];const b=boardOf(o);
 if(cells.some(([x,y])=>b[x+','+y]))return'overlap';
 const mine=new Set(edgesOf(cells));
 for(const m of NAMES){if(m===n||!o[m])continue;if(edgesOf(cellsOf(m,o[m])).some(e=>mine.has(e)))return'touch'}
 return null}
function fits(P,n,p){return !whyNot(P,n,p)}
function clampPos(n,o,x,y){const [w,h]=dims(shape(n,o));return {x:Math.max(0,Math.min(x,COLS-w)),y:Math.max(0,Math.min(y,ROWS-h)),o}}
const DIR={N:[0,-1],S:[0,1],E:[1,0],W:[-1,0]},OPP={N:'S',S:'N',E:'W',W:'E'};
function entry(n){if(n<=10)return[[n-1,-1],'S'];if(n<=18)return[[COLS,n-11],'W'];if(n<=28)return[[COLS-1-(n-19),ROWS],'N'];return[[-1,ROWS-1-(n-29)],'E']}
function labelAt(x,y){if(y===-1)return x+1;if(x===COLS)return 11+y;if(y===ROWS)return 19+(COLS-1-x);return 29+(ROWS-1-y)}
function mirrorD(k,d){const back=(k==='SW'||k==='NE');return back?{E:'S',S:'E',W:'N',N:'W'}[d]:{E:'N',N:'E',W:'S',S:'W'}[d]}
// out=0 means absorbed
function trace(b,n){let [pos,d]=entry(n);const pts=[[pos[0]+.5,pos[1]+.5]],hit=[],ids=new Set(),pcs=[[]];
 const cur=()=>TINT.filter(c=>hit.includes(c));const P_=p=>{pts.push(p);pcs.push(cur())};
 const done=out=>({out,colors:out===0?[]:cur(),pts,pcs,ids});
 for(let g=0;g<1000;g++){const nx=pos[0]+DIR[d][0],ny=pos[1]+DIR[d][1];
  if(nx<0||ny<0||nx>=COLS||ny>=ROWS){P_([nx+.5,ny+.5]);return done(labelAt(nx,ny))}
  const c=b[nx+','+ny];
  if(!c){pos=[nx,ny];P_([nx+.5,ny+.5]);continue}
  ids.add(c.n);
  if(COLOR[c.n]==='schwarz'){P_([(pos[0]+nx)/2+.5,(pos[1]+ny)/2+.5]);return done(0)}
  if(!hit.includes(COLOR[c.n]))hit.push(COLOR[c.n]);
  const side=OPP[d];
  if(c.k==='F'||c.k.includes(side)){P_([(pos[0]+nx)/2+.5,(pos[1]+ny)/2+.5]);d=OPP[d];
   {const pc=b[pos[0]+','+pos[1]];if(pc&&pc.k!=='F'){d=mirrorD(pc.k,d)}P_([pos[0]+.5,pos[1]+.5]);}
   if(pos[0]<0||pos[1]<0||pos[0]>=COLS||pos[1]>=ROWS)return done(labelAt(pos[0],pos[1]));
   continue}
  d=mirrorD(c.k,d);pos=[nx,ny];P_([nx+.5,ny+.5]);
 }}
function unreachable(P){const b=boardOf(P),seen=new Set();for(let n=1;n<=36;n++)for(const i of trace(b,n).ids)seen.add(i);return NAMES.filter(n=>P[n]&&!seen.has(n))}
function scanCell(P,x,y){const c=boardOf(P)[x+','+y];return c?COLOR[c.n]:'leer'}
function rand(n){return Math.floor(Math.random()*n)}
function randomLayout(){const no=OPTS.mirror?8:4;
 for(let t=0;t<2000;t++){const P={};let ok=true;
  for(const n of NAMES){let done=false;for(let i=0;i<120;i++){const o=rand(no);const [w,h]=dims(shape(n,o));const p={x:rand(COLS-w+1),y:rand(ROWS-h+1),o};if(fits(P,n,p)){P[n]=p;done=true;break}}if(!done){ok=false;break}}
  if(ok&&!unreachable(P).length)return P}}
function keyOf(n,p){if(n==='schwarz')return p.x+','+p.y; // nur Position zählt
 return cellsOf(n,p).map(a=>a.join(',')).sort().join(';')}
function same(a,b){return NAMES.every(n=>a[n]&&b[n]&&keyOf(n,a[n])===keyOf(n,b[n]))}
function complete(P){return NAMES.every(n=>P&&P[n])}
function encode(P){return NAMES.map(n=>`${P[n].x}${P[n].y}${P[n].o}`).join(' ')}
function decode(s){const d=(s||'').replace(/\D/g,'');if(d.length!==NAMES.length*3)return null;const P={};
 for(let i=0;i<NAMES.length;i++){const x=+d[i*3],y=+d[i*3+1],o=+d[i*3+2];if(o>7)return null;const n=NAMES[i],p={x,y,o};if(whyNot(P,n,p)==='out'||whyNot(P,n,p)==='overlap')return null;P[n]=p}return P}

const LBL={rot:'Rot',gelb:'Gelb',blau:'Blau',weiss:'Weiß',trans:'Transparent',schwarz:'Schwarz'};
const SHORT={...LBL,trans:'Transp.'};
const FILL={rot:'#E5484D',gelb:'#F5C518',blau:'#2F7BEA',weiss:'#FFFFFF',trans:'#CDEFF5',schwarz:'#2B2838'};
const VALNAME={leer:'leer',...LBL};
const CASE='#16132B';
const TL={outline:'#24213B',board:'#FBFAFE',grid:'#DCD7EA',edge:'#24213B',am:'#6A4BE0',amSoft:'#E3DCFB',muted:'#6E6987'};
const TD={outline:'#D4CFEA',board:'#1A1730',grid:'#2E2A4A',edge:'#8E88B0',am:'#9B85FF',amSoft:'#2F2760',muted:'#9D98B8'};
let T=TL;
const fillOf=c=>c==='schwarz'&&T===TD?'#07060D':FILL[c];
const TKEY='kristall-echo-theme';
let themePref=(()=>{try{return localStorage.getItem(TKEY)||'auto'}catch(e){return'auto'}})();
const darkMQ=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;
const ICONS={auto:'<svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>',
 light:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>',
 dark:'<svg viewBox="0 0 24 24" width="20" height="20"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="currentColor"/></svg>'};
const THEMENAME={auto:'Automatisch (wie das System)',light:'Hell',dark:'Dunkel'};
function applyTheme(){const d=themePref==='auto'?(darkMQ&&darkMQ.matches?'dark':'light'):themePref;
 document.documentElement.dataset.theme=d;T=d==='dark'?TD:TL;
 const m=document.querySelector('meta[name=theme-color]');if(m)m.content=d==='dark'?'#100E1F':'#ECE8F2';
 const b=document.getElementById('themebtn');if(b){b.innerHTML=ICONS[themePref];b.setAttribute('aria-label','Design: '+THEMENAME[themePref])}}
applyTheme();
if(darkMQ){const f=()=>{if(themePref==='auto'){applyTheme();render()}};darkMQ.addEventListener?darkMQ.addEventListener('change',f):darkMQ.addListener(f)}
const KEY='kristall-echo-v2',OKEY='kristall-echo-opts';
let mem=null;
const store={get(k=KEY){try{return JSON.parse(localStorage.getItem(k))}catch(e){return k===KEY?mem:null}},set(v,k=KEY){if(k===KEY)mem=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function fresh(mode,opts){applyOpts(opts);return{mode,opts:{...OPTS},me:{pieces:{},locked:false,answered:[]},opp:{guess:{},marks:{},log:[],fails:0,solved:false,revealed:false},secret:mode==='solo'?randomLayout():null}}
let S=store.get()||{mode:null};
// Migration alter Spielstände (vor den Optionen): Hausregel + Spiegeln wie bisher
if(S.mode&&!S.opts)S.opts={color:'house',mirror:true,scan:false,trans:false,schwarz:false};
applyOpts(S.opts);
const ui={drag:null,tab:S.mode==='duo'?'me':'opp',sel:null,tool:'piece',hl:null,reveal:false,last:null,anim:false,po:{me:{},opp:{}},setup:null};
function save(){store.set(S)}
const $=s=>document.querySelector(s);
const MIXNAME={'':'farblos',rot:'Rot',gelb:'Gelb',blau:'Blau','rot,gelb':'Orange','rot,blau':'Lila','gelb,blau':'Grün','rot,gelb,blau':'Schwarz',
 weiss:'Weiß','rot,weiss':'Rosa','gelb,weiss':'Hellgelb','blau,weiss':'Hellblau','rot,gelb,weiss':'Hellorange','rot,blau,weiss':'Helllila','gelb,blau,weiss':'Hellgrün','rot,gelb,blau,weiss':'Grau'};
const BASEMIX=[[],['rot'],['gelb'],['blau'],['rot','gelb'],['rot','blau'],['gelb','blau'],['rot','gelb','blau']];
function mixes(){return OPTS.color==='orig'?[...BASEMIX,...BASEMIX.map(m=>[...m,'weiss'])]:BASEMIX}
const colorText=c=>MIXNAME[c.filter(x=>TINT.includes(x)).join(',')]||'?';
const dots=c=>c.length?`<i class="dot" style="background:${mixColor(c)}"></i>`:'<i class="dot none"></i>';
const ans=(out,c)=>out===0?'absorbiert':`raus bei ${lab(out)}, ${colorText(c)}`;
const vdot=v=>v==='leer'?'<i class="dot none"></i>':`<i class="dot" style="background:${FILL[v]}"></i>`;
const plural=(n,a,b)=>n===1?a:b;
function optSummary(o=OPTS){const t=[o.color==='orig'?'Original-Farben':'Weiß färbt nicht'];if(o.mirror)t.push('Spiegeln');if(o.scan)t.push('Direkter Scan');if(o.trans)t.push('Transparent');if(o.schwarz)t.push('Schwarz');return t.join(', ')}

/* ---------- SVG ---------- */
function pieceSVG(n,cells,o={}){let f='',ed={};
 for(const [x,y,k] of cells){const p=polyOf(k).map(([a,b])=>[x+a,y+b]);
  f+=`<polygon points="${p.map(q=>q.join(',')).join(' ')}" fill="${fillOf(COLOR[n])}" stroke="${fillOf(COLOR[n])}" stroke-width=".03"/>`;
  p.forEach((q,i)=>{const r=p[(i+1)%p.length];const kk=[q.join(','),r.join(',')].sort().join('|');ed[kk]=(ed[kk]||0)+1})}
 let e='';for(const [kk,c] of Object.entries(ed))if(c===1){const [a,b]=kk.split('|');e+=`M${a}L${b}`}
 if(o.ghost)return`<path d="${e}" fill="none" stroke="${T.outline}" stroke-width=".08" stroke-dasharray=".18 .12" opacity=".8"/>`;
 return`<g>${o.sel?`<path d="${e}" fill="none" stroke="${T.am}" stroke-width=".34" stroke-linejoin="round" opacity=".45" class="pulse"/>`:''}${f}<path d="${e}" fill="none" stroke="${T.outline}" stroke-width=".07" stroke-linejoin="round" stroke-linecap="round"/></g>`}
const MIX={'':'#C4BDDC',rot:'#E5484D',gelb:'#F5C518',blau:'#2F7BEA','rot,gelb':'#F28C28','rot,blau':'#8E44AD','gelb,blau':'#2EAD5B','rot,gelb,blau':'#3A3550'};
function mixColor(c){const w=c.includes('weiss');const base=c.filter(x=>x!=='weiss').join(',');if(!w)return MIX[base];if(!base)return '#FFFFFF';
 const h=MIX[base];const n=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));return '#'+n.map(v=>Math.round(v+(255-v)*.5).toString(16).padStart(2,'0')).join('')}
function raySVG(r,anim){if(!r||!r.pts||r.pts.length<2)return'';const p=r.pts.map(a=>a.slice()),pc=r.pcs||p.map(()=>[]);
 const mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];p[0]=mid(p[0],p[1]);if(r.out!==0)p[p.length-1]=mid(p[p.length-1],p[p.length-2]);
 // lane offset: shift every segment a little to the right of its travel direction, so out- and return paths sit side by side
 {const O=.12,q=p.map(a=>a.slice()),nrm=(a,b)=>{const dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1;return[-dy/l*O,dx/l*O]};
  for(let i=0;i<p.length;i++){const n1=i>0?nrm(p[i-1],p[i]):null,n2=i<p.length-1?nrm(p[i],p[i+1]):null;
   const n=n1&&n2?[n1[0]+n2[0],n1[1]+n2[1]]:(n1||n2);
   // perpendicular turn: sum is the mitre; straight: halve; reversal: sum is 0 (U-turn)
   const straight=n1&&n2&&Math.abs(n1[0]-n2[0])<1e-9&&Math.abs(n1[1]-n2[1])<1e-9;
   q[i]=[p[i][0]+(straight?n[0]/2:n[0]),p[i][1]+(straight?n[1]/2:n[1])]}
  for(let i=0;i<p.length;i++)p[i]=q[i]}
 // group segments by colour state of their start point
 const runs=[];for(let i=0;i<p.length-1;i++){const k=pc[i].join(',');const L=Math.hypot(p[i+1][0]-p[i][0],p[i+1][1]-p[i][1]);
  if(runs.length&&runs[runs.length-1].k===k){const R=runs[runs.length-1];R.pts.push(p[i+1]);R.len+=L}else runs.push({k,c:pc[i],pts:[p[i],p[i+1]],len:L})}
 const total=runs.reduce((s,R)=>s+R.len,0)||1,DUR=1.1;let cum=0,halo='',casing='',core='';
 for(const R of runs){const d='M'+R.pts.map(a=>a.join(',')).join('L');const col=mixColor(R.c);
  const st=anim?` class="anim seg" style="animation-duration:${(R.len/total*DUR).toFixed(3)}s;animation-delay:${(cum/total*DUR).toFixed(3)}s"`:'';cum+=R.len;
  halo+=`<path d="${d}" pathLength="1"${st} fill="none" stroke="${col}" stroke-width=".4" stroke-linejoin="round" stroke-linecap="round" opacity=".25"/>`;
  casing+=`<path d="${d}" pathLength="1"${st} fill="none" stroke="${CASE}" stroke-width=".18" stroke-linejoin="round" stroke-linecap="round"/>`;
  core+=`<path d="${d}" pathLength="1"${st} fill="none" stroke="${col}" stroke-width=".1" stroke-linejoin="round" stroke-linecap="round"/>`}
 const end=p[p.length-1],ab=r.out===0?`<circle cx="${end[0]}" cy="${end[1]}" r=".2" fill="${CASE}"/><path d="M${end[0]-.1},${end[1]-.1}L${end[0]+.1},${end[1]+.1}M${end[0]+.1},${end[1]-.1}L${end[0]-.1},${end[1]+.1}" stroke="#fff" stroke-width=".06"/>`:'';
 return halo+casing+core+ab+`<circle cx="${p[0][0]}" cy="${p[0][1]}" r=".17" fill="${CASE}"/><circle cx="${p[0][0]}" cy="${p[0][1]}" r=".1" fill="${mixColor([])}"/>`}
function boardSVG(o){
 let s2='',svgS='';let s=`<svg viewBox="-1 -1 12 10" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Spielfeld">`;
 s+=`<rect x="0" y="0" width="10" height="8" fill="${T.board}"/>`;
 let g='';for(let i=1;i<COLS;i++)g+=`M${i},0V8`;for(let j=1;j<ROWS;j++)g+=`M0,${j}H10`;
 s+=`<path d="${g}" stroke="${T.grid}" stroke-width=".035"/>`;
 if(o.marks)for(const k of Object.keys(o.marks)){const [x,y]=k.split(',').map(Number);s+=`<path d="M${x+.36},${y+.36}L${x+.64},${y+.64}M${x+.64},${y+.36}L${x+.36},${y+.64}" stroke="#A39DBB" stroke-width=".07" stroke-linecap="round"/>`}
 if(o.scans)for(const s of o.scans){const [x,y]=s.scan;s.val==='leer'
   ?(svgS=`<circle cx="${x+.5}" cy="${y+.5}" r=".16" fill="none" stroke="#A39DBB" stroke-width=".06"/>`)
   :(svgS=`<circle cx="${x+.5}" cy="${y+.5}" r=".2" fill="${FILL[s.val]}" stroke="${T.outline}" stroke-width=".05"/>`);s2+=svgS}
 if(o.pieces)for(const n of NAMES){const p=o.pieces[n];if(!p)continue;const g=pieceSVG(n,cellsOf(n,p),{sel:o.sel===n&&!(ui.drag&&ui.drag.n===n)});s+=ui.drag&&ui.drag.n===n&&ui.drag.ctx===o.ctx?`<g opacity=".22">${g}</g>`:g}
 if(o.ghost)for(const n of NAMES){const p=o.ghost[n];if(p)s+=pieceSVG(n,cellsOf(n,p),{ghost:true})}
 s+=s2;if(o.ray)s+=raySVG(o.ray,o.anim);
 if(o.hlCell)s+=`<rect x="${o.hlCell[0]+.04}" y="${o.hlCell[1]+.04}" width=".92" height=".92" fill="none" stroke="${T.am}" stroke-width=".1" rx=".08"/>`;
 if(o.cover)s+=`<g class="cover"><rect x="0" y="0" width="10" height="8" fill="#2E2852"/>
  <path d="M0,8L3.2,3.6L5,5.4L7.4,1.8L10,6V8Z" fill="#3A3366"/><path d="M3.2,3.6L4.1,8M7.4,1.8L6.6,8" stroke="#4A4280" stroke-width=".05"/>
  <text x="5" y="3.7" text-anchor="middle" font-size=".62" font-weight="700" fill="#fff">Verdeckt</text>
  <text x="5" y="4.5" text-anchor="middle" font-size=".36" fill="#CFC8F2">${o.coverHint||'Tippe den Punkt am Rand an'}</text></g>`;
 if(o.cells)for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)s+=`<rect data-cell="${x},${y}" x="${x}" y="${y}" width="1" height="1" fill="transparent" pointer-events="fill"/>`;
 s+=`<rect x="0" y="0" width="10" height="8" fill="none" stroke="${T.edge}" stroke-width=".08" rx=".05"/>`;
 for(let n=1;n<=36;n++){const [[ex,ey]]=entry(n);const cx=ex+.5,cy=ey+.5;const st=(o.labels&&o.labels[n])||'';
  if(st==='hl')s+=`<circle cx="${cx}" cy="${cy}" r=".44" fill="${T.am}"/>`;
  else if(st==='used')s+=`<circle cx="${cx}" cy="${cy}" r=".4" fill="${T.amSoft}"/>`;
  s+=`<text x="${cx}" y="${cy+.15}" text-anchor="middle" font-size=".42" font-weight="700" fill="${st==='hl'?'#fff':st==='used'?T.am:T.muted}" pointer-events="none">${lab(n)}</text>`;
  s+=`<rect data-label="${n}" x="${ex}" y="${ey}" width="1" height="1" fill="transparent" pointer-events="fill"/>`}
 if(ui.drag&&ui.drag.ctx===o.ctx)s+=`<g id="snapG" pointer-events="none"></g><g id="dragG" pointer-events="none"></g>`;
 return s+'</svg>'}
function miniSVG(n,o,u=12){const c=shape(n,o);const [w,h]=dims(c);return`<svg viewBox="-.15 -.15 ${w+.3} ${h+.3}" style="width:${(w+.3)*u}px;height:${(h+.3)*u}px">${pieceSVG(n,c)}</svg>`}

function tray(ctx,extra=''){const P=ctx==='me'?S.me.pieces:S.opp.guess;

  return`<button class="chip${on?' on':''}" data-act="pick" data-n="${n}" aria-pressed="${on}">${miniSVG(n,o)}<span>${SHORT[COLOR[n]]}</span><span class="st">${P[n]?'liegt':'—'}</span></button>`}).join('');
 const has=ui.sel!=null,placed=has&&P[ui.sel];
 const per=NAMES.length<=5?NAMES.length:Math.ceil(NAMES.length/2);
 return`<div class="tray" style="--per:${per}">${chips}</div>
 <div class="btngrid"><button class="btn" data-act="rot" ${has?'':'disabled'}>Drehen</button>${OPTS.mirror?`<button class="btn" data-act="mir" ${has?'':'disabled'}>Spiegeln</button>`:''}<button class="btn" data-act="del" ${placed?'':'disabled'}>Wegnehmen</button>${extra}</div>`}

function viewStart(){return`<section class="hero">

function logRow(e,num,extra=''){
 if(e.scan)return`<span class="no">${num}</span><span>Feld ${cellName(...e.scan)}</span><span class="dots">${vdot(e.val)}</span><span class="ct">${VALNAME[e.val]}</span>${extra}`;
 if(e.out===0)return`<span class="no">${num}</span><span>${lab(e.n)}</span><span class="dots"><i class="dot" style="background:${CASE}"></i></span><span class="ct">absorbiert</span>${extra}`;
 return`<span class="no">${num}</span><span>${lab(e.n)} ↔ ${lab(e.out)}</span><span class="dots">${dots(e.colors)}</span><span class="ct">${colorText(e.colors)}</span>${extra}`}

function viewMe(){const M=S.me;
 if(!M.locked){const n=NAMES.filter(x=>M.pieces[x]).length,N=NAMES.length;
  return`<p class="hint">Versteck deine ${N} Kristalle: aufs Feld ziehen oder antippen und dann aufs Feld tippen. Steine dürfen sich nur an Ecken berühren.</p>
  <div class="board" data-ctx="me">${boardSVG({ctx:'me',pieces:M.pieces,sel:ui.sel,cells:true})}</div>
  ${tray('me',`<button class="btn" data-act="random">Zufällig verteilen</button><button class="btn primary" data-act="lock" ${n===N?'':'disabled'}>Verdecken (${n}/${N})</button>`)}
  <p class="hint small">Optionen: ${optSummary()}</p>`}
 const labels={};M.answered.forEach(a=>{if(!a.scan){labels[a.n]='used';if(a.out)labels[a.out]='used'}});
 const L=ui.last;if(L&&!L.scan){labels[L.n]='hl';if(L.out)labels[L.out]='hl'}
 let res;
 if(L&&L.scan)res=`<div class="result"><div class="rl">Scan ${cellName(...L.scan)}. Sag:</div><div class="rbig">„Feld ${cellName(...L.scan)}: ${VALNAME[L.val]}.“</div><div class="rdots">${vdot(L.val)}</div></div>`;
 else if(L)res=`<div class="result"><div class="rl">Start ${lab(L.n)}. Sag:</div><div class="rbig">${L.out===0?'„Absorbiert.“':`„Raus bei ${lab(L.out)}${L.out===L.n?' (zurück)':''} – ${colorText(L.colors)}.“`}</div><div class="rdots">${L.out===0?'':dots(L.colors)}</div></div>`;
 else res=`<p class="hint">Dein Gegenüber nennt einen Punkt am Rand${OPTS.scan?' oder ein Feld wie C3':''}. Tipp ihn an, das Handy rechnet die Antwort aus.</p>`;
 const list=M.answered.length?`<h3>Schon beantwortet</h3><ul class="log">${M.answered.map((a,i)=>`<li>${logRow(a,M.answered.length-i)}</li>`).join('')}</ul>`:'';
 return`${res}
 <div class="board" data-ctx="me">${boardSVG({ctx:'me',pieces:M.pieces,cover:!ui.reveal,coverHint:OPTS.scan?'Punkt am Rand oder Feld antippen':null,labels,cells:OPTS.scan,hlCell:ui.reveal&&L&&L.scan?L.scan:null,ray:ui.reveal&&L&&!L.scan?L:null,anim:ui.anim})}</div>
 <div class="row"><button class="btn" data-act="reveal">${ui.reveal?'Verdecken':'Ansehen'}</button><button class="btn primary grow" data-act="verify">Lösung prüfen</button></div>
 ${list}
 <p class="hint small">Optionen: ${optSummary()}</p>
 <div class="row"><button class="link" data-act="unlock">Kristalle neu legen</button></div>`}

function checkEntry(e,G){if(e.scan)return{ok:scanCell(G,...e.scan)===e.val,val:scanCell(G,...e.scan)};
 const r=trace(boardOf(G),e.n);return{ok:r.out===e.out&&r.colors.join()===e.colors.join(),r}}
function viewOpp(){const O=S.opp,solo=S.mode==='solo',N=NAMES.length;
 const labels={};O.log.forEach(e=>{if(!e.scan){labels[e.n]='used';if(e.out)labels[e.out]='used'}});
 let ray=null,cap='',hlCell=null;
 if(ui.hl!=null&&O.log[ui.hl]){const e=O.log[ui.hl],c=checkEntry(e,O.guess);
  if(e.scan){hlCell=e.scan;cap=`<div class="cap"><b>#${ui.hl+1}: Feld ${cellName(...e.scan)} ist ${VALNAME[e.val]}.</b> Bei deiner Vermutung: ${VALNAME[c.val]}. <span class="${c.ok?'ok':'bad'}">${c.ok?'Passt.':'Passt nicht.'}</span></div>`}
  else{labels[e.n]='hl';if(e.out)labels[e.out]='hl';ray=c.r;
   cap=`<div class="cap"><b>#${ui.hl+1}: ${lab(e.n)} ${ans(e.out,e.colors)}.</b> Deine Vermutung ergibt: ${ans(c.r.out,c.r.colors)}. <span class="${c.ok?'ok':'bad'}">${c.ok?'Passt.':'Passt nicht.'}</span></div>`}}
 const n=O.log.length;
 const head=solo?`<p class="hint">${O.solved?'Gelöst! ':''}Tippe einen Punkt am Rand an${OPTS.scan?' oder scanne ein Feld':''}. <b>${n} ${plural(n,'Frage','Fragen')}</b>${O.fails?`, ${O.fails} ${plural(O.fails,'Fehlversuch','Fehlversuche')}`:''}.</p>`
  :`<p class="hint">Tippe den Punkt am Rand an, den du gefragt hast, und trag die Antwort ein.</p>`;
 const tools=[['piece','Vermuten'],['mark','Leer markieren'],...(OPTS.scan?[['scan','Feld scannen']]:[])];
 if(!tools.some(t=>t[0]===ui.tool))ui.tool='piece';
 const seg=`<div class="seg">${tools.map(([k,l])=>`<button class="${ui.tool===k?'on':''}" data-act="tool" data-tool="${k}">${l}</button>`).join('')}</div>`;
 const toolBody=ui.tool==='piece'?tray('opp'):ui.tool==='mark'?'<p class="hint small">Tippe Kästchen an, in denen sicher nichts liegt.</p>':'<p class="hint small">Tippe das Feld an, das du scannen willst (z. B. C3). Das zählt als dein Zug.</p>';
 const all=complete(O.guess);
 const list=n?`<h3>Antworten${all?' – mit deiner Vermutung verglichen':''}</h3><ul class="log">${O.log.map((e,i)=>({e,i})).reverse().map(({e,i})=>{const c=all?checkEntry(e,O.guess):null;
   const extra=(c?`<span class="${c.ok?'ok':'bad'}">${c.ok?'✓':'✗'}</span>`:'')+(solo?'':`<button class="x" data-act="rm" data-i="${i}" aria-label="Eintrag löschen">×</button>`);
   return`<li class="${ui.hl===i?'on':''}" data-act="hl" data-i="${i}">${logRow(e,i+1,extra)}</li>`}).join('')}</ul>`:'';
 const solveBtn=solo&&O.solved?`<button class="btn primary grow" data-act="new" data-mode="solo">Nächstes Rätsel</button>`
  :`<button class="btn primary grow" data-act="solve" ${all?'':'disabled'}>Lösung prüfen${all?'':` (${N} Kristalle legen)`}</button>`;
 return`${head}
 <div class="board" data-ctx="opp">${boardSVG({ctx:'opp',pieces:O.guess,sel:ui.tool==='piece'?ui.sel:null,marks:O.marks,scans:O.log.filter(e=>e.scan),hlCell,labels,ray,anim:ui.anim,cells:true,ghost:solo&&(O.revealed||O.solved)?S.secret:null})}</div>
 ${cap}${seg}${toolBody}
 <div class="row">${solveBtn}</div>
 ${list}
 <p class="hint small">Optionen: ${optSummary()}</p>
 ${solo&&!O.solved&&!O.revealed?'<div class="row"><button class="link" data-act="giveup">Aufgeben und Lösung zeigen</button></div>':''}`}

function viewRules(){const N=NAMES.length;const leg=NAMES.map(n=>`<span class="lg">${miniSVG(n,0,11)}${SHORT[COLOR[n]]}</span>`).join('');
 const colorRule=OPTS.color==='orig'
  ?'<li>Jeder farbige Stein färbt ihn, auch Weiß. Farben mischen sich: Rot+Gelb = Orange, Rot+Blau = Lila, Gelb+Blau = Grün, alle drei = Schwarz. Mit Weiß wird es hell: Rosa, Hellgelb, Hellblau, Hellorange, Helllila, Hellgrün, Grau. Nur Weiß ergibt Weiß.</li>'
  :'<li>Rot, Gelb und Blau färben ihn, Weiß lenkt nur ab. Farben mischen sich: Rot+Gelb = Orange, Rot+Blau = Lila, Gelb+Blau = Grün, alle drei = Schwarz.</li>';
 return`<article class="rules">
 <h2>So geht's</h2>
 <p>Jeder versteckt ${N} Kristalle. Ihr fragt abwechselnd. Die Antwort verrät, <b>wo</b> der Strahl rauskommt und in <b>welcher Farbe</b>. Wer zuerst alle Kristalle exakt richtig hat, gewinnt.</p>
 <div class="legend">${leg}</div>
 <p class="small">Aktive Optionen: ${optSummary()}</p>
 <h3>Kristalle legen</h3>
 <ul><li>Ecken liegen auf den Kreuzungspunkten, nichts liegt schräg oder ragt über den Rand.</li><li>Zwei Steine dürfen sich nie an einer Kante berühren. Ecke an Kante ist erlaubt.</li><li>Jeder Stein muss von mindestens einem Strahl erreichbar sein. Das prüft die App beim Verdecken.</li><li>${OPTS.mirror?'Drehen und Spiegeln sind erlaubt.':'Nur drehen, nicht spiegeln (wie beim echten Stein, der nur eine Oberseite hat).'}</li></ul>
 <h3>Ein Zug</h3>
 <ol><li>Du nennst einen Punkt vom Rand, z.&nbsp;B. „7“ oder „C“${OPTS.scan?', oder ein Feld wie „C3“ (direkter Scan)':''}.</li><li>Dein Gegenüber tippt ihn bei <b>Mein Feld</b> an. Das Handy rechnet und zeigt die Antwort.</li><li>Du tippst bei <b>Gegner</b> dasselbe an und trägst die Antwort ein.</li></ol>
 <h3>Wie der Strahl läuft</h3>
 <ul><li>Geradeaus von Kästchen zu Kästchen.</li><li>Schräge Kante: biegt um 90° ab. Gerade Kante: prallt zurück.</li>${colorRule}<li>Jede Farbe zählt nur einmal. Ohne Kontakt bleibt er farblos.</li>${OPTS.trans?'<li><b>Transparent</b> lenkt ab, färbt aber nicht.</li>':''}${OPTS.schwarz?'<li><b>Schwarz</b> schluckt den Strahl. Antwort: „absorbiert“. Beim Lösen zählt beim schwarzen Stein nur die Position, nicht die Drehung.</li>':''}</ul>
 ${OPTS.scan?'<h3>Direkter Scan</h3><p>Statt eines Strahls fragst du nach einem Feld, z.&nbsp;B. „C3“. Die Antwort ist die Farbe des Steins dort oder „leer“.</p>':''}
 <h3>Lösen</h3>
 <p>Leg deine Vermutung im Gegner-Feld und tippe <b>Lösung prüfen</b>. Du bekommst einen Code. Dein Gegenüber gibt ihn bei <b>Mein Feld → Lösung prüfen</b> ein. Nach Originalregel gilt: richtig = gewonnen, falsch = verloren.</p>
 <h3>Tipps</h3>
 <ul><li>Ein Weg gilt in beide Richtungen: Wenn 3 bei C rauskommt, kommt C bei 3 raus.</li><li>Sobald alle deine Kristalle liegen, zeigt die Liste mit ✓ und ✗, welche Antworten zu deiner Vermutung passen.</li><li>Stellt auf beiden Handys dieselben Optionen ein, sonst passen Antworten und Codes nicht.</li></ul>
 </article>`}

function render(){

let ask=null;
function askSheet(){const a=ask;const ab=a.out===0;
 sheet(`<h3>Start ${lab(a.n)}: wo kam er raus?</h3>
 <div class="numgrid">${LABEL_ORDER.map(k=>`<button class="${a.out===k?'on':''}" data-act="aout" data-k="${k}">${lab(k)}</button>`).join('')}</div>
 ${OPTS.schwarz?`<button class="btn wide${ab?' sel':''}" data-act="aout" data-k="0">Absorbiert</button>`:''}
 ${ab?'':`<h4>Welche Farbe kam raus?</h4>
 <div class="row colors">${mixes().map((m,i)=>`<button class="cbtn${a.colors&&a.colors.join()===m.join()?' on':''}" data-act="acol" data-i="${i}">${dots(m)}${colorText(m)}</button>`).join('')}</div>`}
 <div class="row"><button class="btn" data-act="close">Abbrechen</button><button class="btn primary grow" data-act="asave" ${a.out!=null&&(ab||a.colors)?'':'disabled'}>${a.out==null?'Ausgang wählen':ab?'Speichern: absorbiert':!a.colors?'Farbe wählen':`Speichern: ${lab(a.out)}, ${colorText(a.colors)}`}</button></div>`)}
let scanAsk=null;
function scanSheet(){const s=scanAsk;const vals=['leer','rot','gelb','blau','weiss',...(OPTS.trans?['trans']:[]),...(OPTS.schwarz?['schwarz']:[])];
 sheet(`<h3>Scan ${cellName(...s.cell)}: was ist dort?</h3>
 <div class="row colors">${vals.map(v=>`<button class="cbtn${s.val===v?' on':''}" data-act="sval" data-v="${v}">${vdot(v)}${SHORT[v]||'leer'}</button>`).join('')}</div>
 <div class="row"><button class="btn" data-act="close">Abbrechen</button><button class="btn primary grow" data-act="ssave" ${s.val?'':'disabled'}>${s.val?`Speichern: ${VALNAME[s.val]}`:'Antwort wählen'}</button></div>`)}

/* ---------- Actions ---------- */
function P(ctx){return ctx==='me'?S.me.pieces:S.opp.guess}
function known(n){return S.opp.log.findIndex(e=>!e.scan&&(e.n===n||e.out===n))}
const WHY={out:'Da ist kein Platz',overlap:'Da liegt schon ein Stein',touch:'Steine dürfen sich nicht an einer Kante berühren (Ecken sind okay)'};
function onLabel(ctx,n){
 if(ctx==='me'){if(!S.me.locked){toast('Erst Kristalle legen und verdecken');return}
  const r=trace(boardOf(S.me.pieces),n);ui.last={n,...r};S.me.answered.unshift({n,out:r.out,colors:r.colors});ui.anim=true;save();render();window.scrollTo({top:0,behavior:'smooth'});return}
 const i=known(n);if(i>=0){const e=S.opp.log[i];ui.hl=i;render();toast(e.out===0?`Schon gefragt (#${i+1}): ${lab(e.n)} wurde absorbiert`:`Schon bekannt (#${i+1}): ${lab(e.n)} und ${lab(e.out)} sind verbunden`);return}
 if(S.mode==='solo'){if(S.opp.solved||S.opp.revealed)return;const r=trace(boardOf(S.secret),n);S.opp.log.push({n,out:r.out,colors:r.colors});ui.hl=S.opp.log.length-1;ui.anim=true;save();render();toast(r.out===0?'Absorbiert':`Raus bei ${lab(r.out)} – ${colorText(r.colors)}`);return}
 ask={n,out:null,colors:null};askSheet()}
function onScan(x,y){const i=S.opp.log.findIndex(e=>e.scan&&e.scan[0]===x&&e.scan[1]===y);
 if(i>=0){ui.hl=i;render();toast(`Schon gescannt (#${i+1})`);return}
 if(S.mode==='solo'){if(S.opp.solved||S.opp.revealed)return;const v=scanCell(S.secret,x,y);S.opp.log.push({scan:[x,y],val:v});ui.hl=S.opp.log.length-1;save();render();toast(`Feld ${cellName(x,y)}: ${VALNAME[v]}`);return}
 scanAsk={cell:[x,y],val:null};scanSheet()}
function onCell(ctx,x,y){
 if(ctx==='me'&&S.me.locked){if(!OPTS.scan)return;const v=scanCell(S.me.pieces,x,y);ui.last={scan:[x,y],val:v};S.me.answered.unshift({scan:[x,y],val:v});save();render();window.scrollTo({top:0,behavior:'smooth'});return}
 if(ctx==='opp'&&ui.tool==='scan'){onScan(x,y);return}
 const Pc=P(ctx);const b=boardOf(Pc);const at=b[x+','+y];
 if(ctx==='opp'&&ui.tool==='mark'){if(at){toast('Da liegt deine Vermutung');return}const k=x+','+y;if(S.opp.marks[k])delete S.opp.marks[k];else S.opp.marks[k]=1;save();render();return}
 if(at&&at.n!==ui.sel){ui.sel=at.n;render();return}
 if(at&&at.n===ui.sel){ui.sel=null;render();return}
 if(!ui.sel){toast('Wähle unten erst einen Kristall');return}
 const n=ui.sel;const o=Pc[n]?Pc[n].o:(ui.po[ctx][n]||0);const [w,h]=dims(shape(n,o));
 const p=clampPos(n,o,x-Math.floor((w-1)/2),y-Math.floor((h-1)/2));
 const why=whyNot(Pc,n,p);if(why){toast(WHY[why]);return}
 Pc[n]=p;if(ctx==='opp')for(const [cx,cy] of cellsOf(n,p))delete S.opp.marks[cx+','+cy];save();render()}
function transform(ctx,f){const n=ui.sel;if(!n)return;const Pc=P(ctx);
 if(!Pc[n]){ui.po[ctx][n]=f(ui.po[ctx][n]||0);render();return}
 const no=f(Pc[n].o);const p=clampPos(n,no,Pc[n].x,Pc[n].y);const why=whyNot(Pc,n,p);if(why){toast(why==='touch'?WHY.touch:'Kein Platz dafür – erst verschieben');return}Pc[n]=p;save();render()}
const rotO=o=>(o%4+1)%4+(o>=4?4:0),mirO=o=>(o+4)%8;
function ctxNow(){return ui.tab==='me'?'me':'opp'}
function startGame(m,opts){store.set(opts,OKEY);S=fresh(m,opts);Object.assign(ui,{tab:m==='duo'?'me':'opp',sel:null,tool:'piece',hl:null,reveal:false,last:null,po:{me:{},opp:{}}});save();close();render();window.scrollTo(0,0)}

document.addEventListener('click',ev=>{
 if(suppressClick){suppressClick=false;return}
 const labEl=ev.target.closest('[data-label]'),cell=ev.target.closest('[data-cell]');
 if(labEl||cell){const ctx=ev.target.closest('.board').dataset.ctx;if(labEl)onLabel(ctx,+labEl.dataset.label);else{const [x,y]=cell.dataset.cell.split(',').map(Number);onCell(ctx,x,y)}return}
 const t=ev.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
 switch(a){
 case'tab':ui.tab=t.dataset.tab==='start'?'opp':t.dataset.tab;ui.sel=null;render();window.scrollTo(0,0);break;
 case'setup':ui.setup={mode:t.dataset.mode,opts:{...DEFAULT_OPTS,...(store.get(OKEY)||{})}};setupSheet();break;
 case'scol':ui.setup.opts.color=t.dataset.v;setupSheet();break;
 case'sopt':{const k=t.dataset.k;ui.setup.opts[k]=!ui.setup.opts[k];setupSheet()}break;
 case'start':startGame(ui.setup.mode,ui.setup.opts);break;
 case'new':startGame(t.dataset.mode,S.opts||DEFAULT_OPTS);break;
 case'newmenu':sheet(`<h3>Neues Spiel</h3><div class="stack"><button class="mode" data-act="setup" data-mode="duo"><b>Gegeneinander</b><span>Jeder auf seinem Handy.</span></button><button class="mode" data-act="setup" data-mode="solo"><b>Solo gegen das Handy</b><span>Das Handy versteckt, du suchst.</span></button></div><div class="row"><button class="btn grow" data-act="close">Abbrechen</button></div>`);break;
 case'pick':ui.sel=ui.sel===t.dataset.n?null:t.dataset.n;render();break;
 case'rot':transform(ctxNow(),rotO);break;
 case'mir':transform(ctxNow(),mirO);break;
 case'del':{const Pc=P(ctxNow());if(ui.sel&&Pc[ui.sel]){ui.po[ctxNow()][ui.sel]=Pc[ui.sel].o;delete Pc[ui.sel];save();render()}break}
 case'random':{const R=randomLayout();if(!R){toast('Keine passende Verteilung gefunden – nochmal tippen');break}S.me.pieces=R;ui.sel=null;save();render()}break;
 case'lock':{const u=unreachable(S.me.pieces);if(u.length){ui.sel=u[0];render();toast(`${u.map(n=>LBL[COLOR[n]]).join(', ')}: von keinem Strahl erreichbar. Bitte anders legen.`);break}
  S.me.locked=true;ui.sel=null;ui.reveal=false;ui.last=null;save();render();window.scrollTo(0,0);toast('Verdeckt. Viel Spaß!')}break;
 case'unlock':if(!t.dataset.ok&&S.me.answered.length){sheet(`<h3>Kristalle neu legen?</h3><p>Du hast schon ${S.me.answered.length} Fragen beantwortet. Wenn du umlegst, stimmen die alten Antworten nicht mehr.</p><div class="row"><button class="btn" data-act="close">Abbrechen</button><button class="btn primary grow" data-act="unlock" data-ok="1">Trotzdem neu legen</button></div>`);break}
  S.me.locked=false;S.me.answered=[];ui.last=null;close();save();render();break;
 case'reveal':ui.reveal=!ui.reveal;render();break;
 case'tool':ui.tool=t.dataset.tool;render();break;
 case'hl':if(ev.target.closest('.x'))break;{const i=+t.dataset.i;ui.hl=ui.hl===i?null:i;ui.anim=ui.hl!=null;render();window.scrollTo({top:0,behavior:'smooth'})}break;
 case'rm':{const i=+t.dataset.i;S.opp.log.splice(i,1);ui.hl=null;save();render();toast('Eintrag gelöscht')}break;
 case'aout':ask.out=+t.dataset.k;if(ask.out===0)ask.colors=[];else if(ask.colors&&!ask.colors.length&&ask.wasAb)ask.colors=null;ask.wasAb=ask.out===0;askSheet();break;
 case'acol':ask.colors=mixes()[+t.dataset.i].slice();askSheet();break;
 case'asave':S.opp.log.push({n:ask.n,out:ask.out,colors:ask.out===0?[]:ask.colors.slice()});ui.hl=S.opp.log.length-1;ui.anim=true;save();close();render();break;
 case'sval':scanAsk.val=t.dataset.v;scanSheet();break;
 case'ssave':S.opp.log.push({scan:scanAsk.cell,val:scanAsk.val});ui.hl=S.opp.log.length-1;save();close();render();break;
 case'solve':{if(!complete(S.opp.guess))break;
  if(S.mode==='solo'){if(same(S.opp.guess,S.secret)){S.opp.solved=true;ui.hl=null;save();render();const q=S.opp.log.length;sheet(`<h3 class="win">Gefunden!</h3><p>Mit <b>${q} ${plural(q,'Frage','Fragen')}</b>${S.opp.fails?` und ${S.opp.fails} ${plural(S.opp.fails,'Fehlversuch','Fehlversuchen')}`:''}.</p><div class="row"><button class="btn" data-act="close">Ansehen</button><button class="btn primary grow" data-act="new" data-mode="solo">Nächstes Rätsel</button></div>`)}
   else{S.opp.fails++;save();render();toast('Stimmt noch nicht. Schau dir die ✗ in der Liste an.')}break}
  sheet(`<h3>Dein Lösungs-Code</h3><p>Sag oder schick ihn deinem Gegenüber. Es gibt ihn bei <b>Mein Feld → Lösung prüfen</b> ein.</p><div class="code">${encode(S.opp.guess)}</div><div class="row"><button class="btn grow" data-act="copy" data-c="${encode(S.opp.guess)}">Kopieren</button><button class="btn primary grow" data-act="close">Fertig</button></div>`);break}
 case'copy':navigator.clipboard&&navigator.clipboard.writeText(t.dataset.c).then(()=>toast('Kopiert'),()=>toast('Kopieren ging nicht'));break;
 case'verify':sheet(`<h3>Lösung prüfen</h3><p>Gib den ${NAMES.length*3}-stelligen Code deines Gegenübers ein.</p><input id="code" inputmode="numeric" autocomplete="off" placeholder="${NAMES.map(()=>'000').join(' ')}"><div id="vres"></div><div class="row"><button class="btn" data-act="close">Schließen</button><button class="btn primary grow" data-act="vcheck">Prüfen</button></div>`);setTimeout(()=>$('#code')&&$('#code').focus(),50);break;
 case'vcheck':{const G=decode($('#code').value);const el=$('#vres');
  if(!G){el.innerHTML=`<div class="verdict bad">Code ungültig. Er hat ${NAMES.length*3} Ziffern. Habt ihr dieselben Optionen?</div>`;break}
  const ok=same(G,S.me.pieces);el.innerHTML=ok?'<div class="verdict ok">Stimmt! Dein Gegenüber hat gewonnen.</div>':'<div class="verdict bad">Stimmt nicht. Nach Originalregel hat dein Gegenüber damit verloren.</div>';break}
 case'giveup':if(!t.dataset.ok){sheet(`<h3>Lösung zeigen?</h3><p>Die Kristalle erscheinen gestrichelt auf deinem Feld.</p><div class="row"><button class="btn" data-act="close">Weitersuchen</button><button class="btn primary grow" data-act="giveup" data-ok="1">Zeigen</button></div>`);break}
  S.opp.revealed=true;save();close();render();break;
 case'close':close();break;
 case'theme':{const order=['auto','light','dark'];themePref=order[(order.indexOf(themePref)+1)%3];try{localStorage.setItem(TKEY,themePref)}catch(e){}applyTheme();render();toast('Design: '+THEMENAME[themePref])}break;
 }});
/* ---------- Drag & Drop ---------- */
let pend=null,suppressClick=false,touchSynth=false,raf=0,lastEv=null;
function canPlace(ctx){return ctx==='me'?!S.me.locked:ui.tool==='piece'}
function boardSvg(ctx){return document.querySelector(`.board[data-ctx="${ctx}"] svg`)}
function toSvg(svg,e){const m=svg.getScreenCTM();if(!m)return{x:-99,y:-99};const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(m.inverse());return{x:p.x,y:p.y}}
function outlineSVG(cells,color,dash){const e=edgesOf(cells).map(k=>{const [a,b]=k.split('|');return`M${a}L${b}`}).join('');
 return`<path d="${e}" fill="none" stroke="${color}" stroke-width=".1" ${dash?'stroke-dasharray=".2 .14"':''} stroke-linejoin="round"/>`}
// Kann an dieser Stelle ein Ziehen beginnen?
function dragCandidate(t){if(!t||!t.closest)return false;
 const chip=t.closest('.chip[data-n]');if(chip)return canPlace(ctxNow());
 const cell=t.closest('[data-cell]');if(!cell)return false;const b=t.closest('.board');if(!b)return false;const ctx=b.dataset.ctx;if(!canPlace(ctx))return false;
 return !!boardOf(P(ctx))[cell.dataset.cell]}
// Bei Berührung auf einem Stein sofort das Scrollen sperren (zuverlässiger als erst beim Bewegen)
document.addEventListener('touchstart',e=>{if(e.touches.length===1&&dragCandidate(e.target)){e.preventDefault();touchSynth=true}},{passive:false});
document.addEventListener('touchmove',e=>{if(pend||touchSynth)e.preventDefault()},{passive:false});
document.addEventListener('pointerdown',e=>{
 if(e.button>0||pend)return;
 const chip=e.target.closest('.chip[data-n]');
 const cell=e.target.closest('[data-cell]');
 if(chip){const ctx=ctxNow();if(!canPlace(ctx))return;const n=chip.dataset.n,Pc=P(ctx);const o=Pc[n]?Pc[n].o:(ui.po[ctx][n]||0);const [w,h]=dims(shape(n,o));
  pend={kind:'tray',el:chip,ctx,n,o,grab:[w/2,h/2],x0:e.clientX,y0:e.clientY,touch:e.pointerType==='touch',moved:false};return}
 if(cell){const ctx=e.target.closest('.board').dataset.ctx;if(!canPlace(ctx))return;const [x,y]=cell.dataset.cell.split(',').map(Number);
  const at=boardOf(P(ctx))[x+','+y];if(!at)return;const p=P(ctx)[at.n];const pt=toSvg(boardSvg(ctx),e);
  pend={kind:'board',el:cell,ctx,n:at.n,o:p.o,grab:[pt.x-p.x,pt.y-p.y],x0:e.clientX,y0:e.clientY,touch:e.pointerType==='touch',moved:false}}
});
document.addEventListener('pointermove',e=>{
 if(!pend)return;
 if(!pend.moved){if(Math.hypot(e.clientX-pend.x0,e.clientY-pend.y0)<6)return;
  pend.moved=true;ui.drag={ctx:pend.ctx,n:pend.n};ui.sel=pend.n;render();
  pend.svg=boardSvg(pend.ctx);pend.g=document.getElementById('dragG');pend.sg=document.getElementById('snapG');
  if(pend.g)pend.g.innerHTML=pieceSVG(pend.n,shape(pend.n,pend.o),{})}
 lastEv={clientX:e.clientX,clientY:e.clientY};
 if(!raf)raf=requestAnimationFrame(()=>{raf=0;if(pend&&pend.moved&&lastEv)dragUpdate(lastEv)})});
function dragUpdate(e,d=pend){if(!d||!d.svg)return;const pt=toSvg(d.svg,e);
 const lift=d.touch?1:0;const fx=pt.x-d.grab[0],fy=pt.y-d.grab[1]-lift;
 if(d.g)d.g.setAttribute('transform',`translate(${fx.toFixed(3)},${fy.toFixed(3)})`);
 const off=pt.x<-.6||pt.y<-.6||pt.x>COLS+.6||pt.y>ROWS+.6;
 if(off!==d.off){d.off=off;if(d.g)d.g.setAttribute('opacity',off?'.55':'1')}
 if(off){d.target=null;d.key=null;if(d.sg)d.sg.innerHTML='';return}
 const p=clampPos(d.n,d.o,Math.round(fx),Math.round(fy));const key=p.x+','+p.y;
 if(key===d.key)return; // nur neu prüfen, wenn sich das Einrast-Feld ändert
 d.key=key;const why=whyNot(P(d.ctx),d.n,p);d.target=p;d.why=why;
 if(d.sg)d.sg.innerHTML=outlineSVG(cellsOf(d.n,p),why?'#E5484D':T.am,!!why)}
function dragEnd(commit){const d=pend;pend=null;const synth=touchSynth;touchSynth=false;if(raf){cancelAnimationFrame(raf);raf=0}
 if(!d)return;
 if(!d.moved){ // war nur ein Tippen: Klick selbst auslösen, weil der Browser ihn wegen der Scroll-Sperre nicht schickt
  if(commit&&synth&&d.el&&d.el.isConnected)d.el.dispatchEvent(new MouseEvent('click',{bubbles:true}));return}
 if(lastEv)dragUpdate(lastEv,d);lastEv=null;
 suppressClick=!synth;if(suppressClick)setTimeout(()=>suppressClick=false,80);ui.drag=null;
 if(commit){const Pc=P(d.ctx);
  if(d.off){if(d.kind==='board'){ui.po[d.ctx][d.n]=Pc[d.n].o;delete Pc[d.n];ui.sel=null;save();toast('Weggenommen')}}
  else if(d.target&&!d.why){Pc[d.n]=d.target;ui.sel=d.n;if(d.ctx==='opp')for(const [cx,cy] of cellsOf(d.n,d.target))delete S.opp.marks[cx+','+cy];save()}
  else if(d.why)toast(WHY[d.why])}
 render()}
document.addEventListener('pointerup',()=>dragEnd(true));
document.addEventListener('pointercancel',()=>dragEnd(false));
document.addEventListener('touchend',()=>{if(!pend)touchSynth=false});

render();

</script></body></html>
